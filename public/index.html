<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色卡仓库</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 深空黑底 + 琥珀金 */
            --bg-deep: #0a0c10;
            --bg-surface: #12151c;
            --bg-card: rgba(18, 21, 28, 0.8);
            --accent: #d4a853;
            --accent-glow: rgba(212, 168, 83, 0.3);
            --text-primary: #e8e6e3;
            --text-secondary: #8a8f98;
            --border: rgba(255, 255, 255, 0.06);
            --glass: rgba(255, 255, 255, 0.03);
            
            /* 动画变量 */
            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 背景动画 */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(ellipse at 20% 80%, rgba(212, 168, 83, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(100, 100, 120, 0.1) 0%, transparent 50%),
                linear-gradient(135deg, var(--bg-deep) 0%, #0d1117 100%);
        }

        /* 噪点纹理 */
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        /* 登录页 */
        .login-page {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 255, 255, 0.05) inset;
        }

        .login-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 600;
            text-align: center;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent) 0%, #f4d03f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 32px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 16px;
            transition: var(--transition-fast);
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .btn {
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, var(--accent) 0%, #c9952a 100%);
            border: none;
            border-radius: 8px;
            color: #0a0c10;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px var(--accent-glow);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* 主应用布局 */
        .app {
            display: none;
            min-height: 100vh;
        }

        .app.active {
            display: block;
        }

        /* 导航栏 */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 12, 16, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
        }

        .navbar-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 600;
            background: linear-gradient(135deg, var(--accent) 0%, #f4d03f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .navbar-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .search-container {
            position: relative;
            flex: 1;
            max-width: 400px;
            margin: 0 24px;
        }

        .search-input {
            width: 100%;
            padding: 10px 16px 10px 40px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            transition: var(--transition-fast);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        /* 工具栏 */
        .toolbar {
            max-width: 1400px;
            margin: 24px auto;
            padding: 0 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .toolbar-left {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .toolbar-right {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .view-toggle {
            display: flex;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 4px;
        }

        .view-btn {
            padding: 8px 12px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 6px;
            transition: var(--transition-fast);
        }

        .view-btn.active {
            background: var(--accent);
            color: #0a0c10;
        }

        /* 标签云 */
        .tags-cloud {
            max-width: 1400px;
            margin: 0 auto 24px;
            padding: 0 24px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .tag:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .tag.active {
            background: var(--accent);
            color: #0a0c10;
            border-color: var(--accent);
        }

        /* 卡片网格 */
        .cards-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px 24px;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* 角色卡卡片 */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition-normal);
            position: relative;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 
                0 20px 40px -20px rgba(212, 168, 83, 0.2),
                0 0 0 1px var(--accent-glow) inset;
        }

        .card-image {
            width: 100%;
            aspect-ratio: 1;
            object-fit: contain;
            background: var(--bg-surface);
        }

        .card-content {
            padding: 16px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-primary);
        }

        .card-creator {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .card-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .card-tag {
            padding: 4px 8px;
            background: rgba(212, 168, 83, 0.1);
            border-radius: 4px;
            font-size: 11px;
            color: var(--accent);
        }

        /* 列表视图卡片 */
        .card-list-item {
            display: flex;
            gap: 16px;
            padding: 16px;
            background: var(--bg-card);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition-normal);
        }

        .card-list-item:hover {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .card-list-image {
            width: 80px;
            height: 80px;
            object-fit: contain;
            border-radius: 8px;
            background: var(--bg-surface);
        }

        .card-list-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* 详情页 */
        .detail-page {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 12, 16, 0.9);
            backdrop-filter: blur(20px);
            z-index: 200;
            transform: translateX(100%);
            transition: var(--transition-slow);
            overflow-y: auto;
        }

        .detail-page.active {
            transform: translateX(0);
        }

        .detail-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .detail-close {
            position: fixed;
            top: 24px;
            right: 24px;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50%;
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .detail-close:hover {
            background: var(--accent);
            color: #0a0c10;
        }

        .detail-header {
            display: flex;
            gap: 24px;
            margin-bottom: 32px;
        }

        .detail-image {
            width: 200px;
            height: 200px;
            object-fit: contain;
            border-radius: 12px;
            border: 2px solid var(--border);
            background: var(--bg-surface);
        }

        .detail-info {
            flex: 1;
        }

        .detail-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--accent) 0%, #f4d03f 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .detail-creator {
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .creator-edit {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 13px;
            margin-left: 6px;
            padding: 2px 6px;
            border-radius: 4px;
            transition: var(--transition-fast);
        }

        .creator-edit:hover {
            background: var(--accent-glow);
        }

        .detail-section {
            margin-bottom: 24px;
        }

        .detail-section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .detail-section-content {
            color: var(--text-primary);
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .detail-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        /* 加载更多 */
        .load-more {
            text-align: center;
            padding: 40px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 分页 */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
        }

        .page-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition-fast);
        }

        .page-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .page-btn.active {
            background: var(--accent);
            color: #0a0c10;
            border-color: var(--accent);
        }

        /* 上传区域 */
        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            transition: var(--transition-fast);
            cursor: pointer;
        }

        .upload-zone:hover,
        .upload-zone.dragover {
            border-color: var(--accent);
            background: rgba(212, 168, 83, 0.05);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 16px;
            color: var(--text-secondary);
        }

        .upload-text {
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .upload-hint {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* 进度条 */
        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 16px;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            transition: var(--transition-fast);
        }

        /* 模态框 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 300;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition-fast);
        }

        .modal.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            max-width: 500px;
            width: 90%;
            transform: scale(0.9);
            transition: var(--transition-fast);
        }

        .modal.active .modal-content {
            transform: scale(1);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 24px;
        }

        /* 聊天记录 */
        .chat-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-top: 24px;
        }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .chat-messages {
            max-height: 400px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
        }

        .message.user {
            align-self: flex-end;
            background: var(--accent);
            color: #0a0c10;
        }

        .message.assistant {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.05);
        }

        .message-role {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        /* 聊天记录列表项 */
        .chat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .chat-item-info {
            flex: 1;
            min-width: 200px;
        }

        .chat-item-title {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .chat-item-meta {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .chat-item-actions {
            display: flex;
            gap: 8px;
        }

        .chat-item-actions .btn {
            width: auto;
            padding: 6px 14px;
            font-size: 13px;
        }

        /* 批量操作栏 */
        .batch-bar {
            display: none;
            max-width: 1400px;
            margin: 0 auto 16px;
            padding: 12px 24px;
            background: var(--bg-card);
            border: 1px solid var(--accent-glow);
            border-radius: 12px;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .batch-bar.active {
            display: flex;
        }

        .batch-bar .btn,
        .navbar-actions .btn,
        .detail-actions .btn {
            width: auto;
        }

        /* 搜索清除按钮 */
        .search-clear {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            display: none;
            line-height: 1;
        }

        .search-clear:hover {
            color: var(--accent);
        }

        .search-clear.visible {
            display: block;
        }

        /* 设置面板 */
        .settings-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            color: var(--text-primary);
        }

        .setting-row input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .setting-hint {
            font-size: 12px;
            color: var(--text-secondary);
            margin: -8px 0 0;
        }

        /* 减弱动画 */
        body.no-anim .animate-in {
            animation: none;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }

        .empty-state .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-state p {
            font-size: 16px;
        }

        .empty-state .empty-hint {
            font-size: 13px;
            margin-top: 8px;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .navbar-content {
                flex-wrap: wrap;
                gap: 12px;
            }

            .search-container {
                order: 3;
                max-width: 100%;
                margin: 0;
                width: 100%;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .toolbar-left,
            .toolbar-right {
                justify-content: center;
            }

            .detail-header {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }

            .detail-image {
                width: 150px;
                height: 150px;
            }

            .cards-grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            }
        }

        /* 动画 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-in {
            animation: fadeInUp 0.5s ease forwards;
        }

        .stagger-1 { animation-delay: 0.1s; }
        .stagger-2 { animation-delay: 0.2s; }
        .stagger-3 { animation-delay: 0.3s; }
        .stagger-4 { animation-delay: 0.4s; }

        /* 亮色主题：整体覆盖变量，所有使用变量的组件全局切换 */
        body.light-theme {
            --bg-deep: #f5f3f0;
            --bg-surface: #ffffff;
            --bg-card: #ffffff;
            --accent: #a67c00;
            --accent-glow: rgba(166, 124, 0, 0.25);
            --text-primary: #1f2329;
            --text-secondary: #6b7280;
            --border: rgba(0, 0, 0, 0.12);
            --glass: rgba(0, 0, 0, 0.03);
            background-color: var(--bg-deep);
            color: var(--text-primary);
        }

        body.light-theme .bg-gradient {
            background:
                radial-gradient(ellipse at 20% 80%, rgba(166, 124, 0, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 0, 0, 0.05) 0%, transparent 50%),
                linear-gradient(135deg, #f5f3f0 0%, #ece9e4 100%);
        }

        body.light-theme .navbar {
            background: rgba(255, 255, 255, 0.85);
        }

        body.light-theme .detail-page {
            background: rgba(255, 255, 255, 0.95);
        }

        body.light-theme .message.assistant {
            background: rgba(0, 0, 0, 0.05);
        }

        body.light-theme .detail-close {
            background: rgba(0, 0, 0, 0.08);
        }

        /* 渐变文字改为深金色调，避免浅色背景上看不清 */
        body.light-theme .login-title,
        body.light-theme .navbar-brand,
        body.light-theme .detail-title {
            background: linear-gradient(135deg, #8a6508 0%, #b8860b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="noise-overlay"></div>

    <!-- 登录页 -->
    <div class="login-page" id="loginPage">
        <div class="login-container animate-in">
            <h1 class="login-title">角色卡仓库</h1>
            <p class="login-subtitle">Character Card Vault</p>
            <form id="loginForm">
                <div class="input-group">
                    <label class="input-label">访问密码</label>
                    <input type="password" class="input-field" id="password" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="btn">进入仓库</button>
            </form>
        </div>
    </div>

    <!-- 主应用 -->
    <div class="app" id="app">
        <!-- 导航栏 -->
        <nav class="navbar">
            <div class="navbar-content">
                <div class="navbar-brand">角色卡仓库</div>
                <div class="search-container">
                    <span class="search-icon">🔍</span>
                    <input type="text" class="search-input" id="searchInput" placeholder="搜索角色卡...">
                    <button class="search-clear" id="searchClear" title="清空搜索">×</button>
                </div>
                <div class="navbar-actions">
                    <button class="btn btn-secondary" id="importBtn">导入</button>
                    <button class="btn btn-secondary" id="importBackupBtn">恢复备份</button>
                    <button class="btn btn-secondary" id="exportAllBtn">全量备份</button>
                    <button class="view-btn" id="themeToggle">🌙</button>
                    <button class="view-btn" id="settingsBtn" title="设置">⚙</button>
                    <input type="file" id="backupFileInput" accept=".json" style="display: none;">
                </div>
            </div>
        </nav>

        <!-- 工具栏 -->
        <div class="toolbar">
            <div class="toolbar-left">
                <div class="view-toggle">
                    <button class="view-btn active" data-view="grid">网格</button>
                    <button class="view-btn" data-view="list">列表</button>
                </div>
                <select class="input-field" id="sortSelect" style="width: auto; padding: 8px 12px;">
                    <option value="new">最新上传</option>
                    <option value="old">最早上传</option>
                    <option value="az">按名称排序</option>
                </select>
                <select class="input-field" id="searchScope" style="width: auto; padding: 8px 12px;" title="搜索范围">
                    <option value="all">全部字段</option>
                    <option value="name">名称</option>
                    <option value="creator">作者</option>
                    <option value="description">描述</option>
                    <option value="first_mes">开场白</option>
                    <option value="system_prompt">系统提示词</option>
                </select>
                <label style="display: flex; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 14px;">
                    <input type="checkbox" id="favoriteFilter"> 仅收藏
                </label>
                <label style="display: flex; align-items: center; gap: 8px; color: var(--text-secondary); font-size: 14px;">
                    <input type="checkbox" id="chatFilter"> 有聊天记录
                </label>
                <button class="btn btn-secondary" id="batchModeBtn" style="width: auto; padding: 8px 16px;">多选</button>
            </div>
            <div class="toolbar-right">
                <span id="cardCount" style="color: var(--text-secondary); font-size: 14px;">共 0 张角色卡</span>
            </div>
        </div>

        <!-- 标签云 -->
        <div class="tags-cloud" id="tagsCloud"></div>

        <!-- 批量操作栏 -->
        <div class="batch-bar" id="batchBar">
            <span id="batchCount" style="color: var(--text-secondary); font-size: 14px;">已选 0 张</span>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <button class="btn btn-secondary" id="batchSelectAll">全选本页</button>
                <button class="btn btn-secondary" id="batchFavorite">批量收藏</button>
                <button class="btn btn-secondary" id="batchUnfavorite">批量取消收藏</button>
                <button class="btn btn-secondary" id="batchExport">批量导出</button>
                <button class="btn btn-secondary" id="batchDelete">批量删除</button>
                <button class="btn btn-secondary" id="batchExit">退出多选</button>
            </div>
        </div>

        <!-- 卡片容器 -->
        <div class="cards-container">
            <div class="cards-grid" id="cardsContainer"></div>
            <div class="load-more" id="loadMore" style="display: none;">
                <div class="loading-spinner"></div>
            </div>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>

    <!-- 详情页 -->
    <div class="detail-page" id="detailPage">
        <button class="detail-close" id="detailClose">×</button>
        <div class="detail-container" id="detailContent"></div>
    </div>

    <!-- 上传模态框 -->
    <div class="modal" id="uploadModal">
        <div class="modal-content">
            <h2 class="modal-title">导入角色卡</h2>
            <div class="upload-zone" id="uploadZone">
                <div class="upload-icon">📁</div>
                <p class="upload-text">拖拽文件到此处，或点击选择</p>
                <p class="upload-hint">支持 PNG / JSON 格式，单个最大 50MB</p>
                <p class="upload-hint" style="color: var(--accent);">⚠️ Telegram 限流：一次不要上传超过 20 张，否则会被限流失败</p>
                <input type="file" id="fileInput" accept=".png,.json" multiple style="display: none;">
            </div>
            <div class="progress-bar" id="progressBar" style="display: none;">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p id="uploadStatus" style="display: none; margin-top: 8px; font-size: 13px; color: var(--text-secondary); text-align: center; word-break: break-all;"></p>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="cancelUpload">取消</button>
                <button class="btn" id="confirmUpload" disabled>确认导入</button>
            </div>
        </div>
    </div>

    <!-- 聊天记录模态框 -->
    <div class="modal" id="chatModal">
        <div class="modal-content" style="max-width: 700px;">
            <h2 class="modal-title" id="chatModalTitle">聊天记录</h2>
            <div class="chat-messages" id="chatMessages" style="max-height: 60vh; padding-right: 8px;"></div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="chatModalClose">关闭</button>
            </div>
        </div>
    </div>

    <!-- 设置模态框 -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h2 class="modal-title">设置</h2>
            <div class="settings-list">
                <label class="setting-row">
                    <span>背景图显示</span>
                    <input type="checkbox" id="settingBackground">
                </label>
                <p class="setting-hint" id="settingBackgroundHint" style="display: none;">未配置 SITE_BACKGROUND 环境变量</p>
                <label class="setting-row">
                    <span>主题</span>
                    <select id="settingTheme" class="input-field" style="width: auto; padding: 6px 10px;">
                        <option value="dark">深色</option>
                        <option value="light">浅色</option>
                    </select>
                </label>
                <label class="setting-row">
                    <span>每页数量</span>
                    <select id="settingPageSize" class="input-field" style="width: auto; padding: 6px 10px;">
                        <option value="12">12</option>
                        <option value="30">30</option>
                        <option value="60">60</option>
                    </select>
                </label>
                <label class="setting-row">
                    <span>减弱动画</span>
                    <input type="checkbox" id="settingReduceMotion">
                </label>
                <div class="setting-row">
                    <span>缩略图缓存</span>
                    <button class="btn btn-secondary" id="settingClearCache" style="width: auto; padding: 6px 14px; font-size: 13px;">清空缓存</button>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="settingsClose">关闭</button>
            </div>
        </div>
    </div>

    <script>
        // 应用状态
        const state = {
            token: localStorage.getItem('token'),
            cards: [],
            tags: [],
            currentPage: 1,
            totalPages: 1,
            viewMode: 'grid',
            searchQuery: '',
            selectedTag: null,
            sortBy: 'new',
            favoritesOnly: false,
            hasChatOnly: false,
            selectMode: false,
            selectedIds: new Set(),
            tagManage: false,
            searchScope: 'all'
        };

        // 当前查看详情的角色卡
        let currentCard = null;

        // API 基础 URL
        const API_BASE = '/api';

        // 内联 SVG 占位图（/placeholder.png 文件不存在）
        const PLACEHOLDER = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='12' fill='%2312151c'/%3E%3Ctext x='50' y='58' font-size='38' text-anchor='middle'%3E%F0%9F%97%82%EF%B8%8F%3C/text%3E%3C/svg%3E";

        // 用户偏好设置（浏览器维度，存 localStorage）
        const settings = Object.assign({
            showBackground: true,
            theme: 'dark',
            pageSize: 30,
            reduceMotion: false,
            viewMode: 'grid'
        }, JSON.parse(localStorage.getItem('settings') || '{}'));
        // 迁移旧版主题偏好
        if (!localStorage.getItem('settings') && localStorage.getItem('theme') === 'light') {
            settings.theme = 'light';
        }

        // 站点配置（由 /api/config 填充）
        let siteConfig = {};

        function saveSettings() {
            localStorage.setItem('settings', JSON.stringify(settings));
        }

        function applyBackground() {
            const bg = document.querySelector('.bg-gradient');
            if (settings.showBackground && siteConfig.siteBackground) {
                bg.style.background =
                    `linear-gradient(rgba(10, 12, 16, 0.75), rgba(10, 12, 16, 0.75)), url("${siteConfig.siteBackground}") center / cover no-repeat`;
            } else {
                bg.style.background = '';
            }
        }

        function applySettings() {
            const isLight = settings.theme === 'light';
            document.body.classList.toggle('light-theme', isLight);
            document.getElementById('themeToggle').textContent = isLight ? '☀️' : '🌙';
            document.body.classList.toggle('no-anim', settings.reduceMotion);
            if (state.viewMode !== settings.viewMode) {
                state.viewMode = settings.viewMode;
                document.querySelectorAll('.view-btn[data-view]').forEach(b => {
                    b.classList.toggle('active', b.dataset.view === settings.viewMode);
                });
            }
            applyBackground();
        }

        function initSettingsUI() {
            document.getElementById('settingBackground').checked = settings.showBackground;
            document.getElementById('settingTheme').value = settings.theme;
            document.getElementById('settingPageSize').value = String(settings.pageSize);
            document.getElementById('settingReduceMotion').checked = settings.reduceMotion;

            const bgInput = document.getElementById('settingBackground');
            bgInput.addEventListener('change', (e) => {
                settings.showBackground = e.target.checked;
                saveSettings();
                applyBackground();
            });
            document.getElementById('settingTheme').addEventListener('change', (e) => {
                settings.theme = e.target.value;
                saveSettings();
                applySettings();
            });
            document.getElementById('settingPageSize').addEventListener('change', (e) => {
                settings.pageSize = parseInt(e.target.value, 10);
                saveSettings();
                loadCards(1);
            });
            document.getElementById('settingReduceMotion').addEventListener('change', (e) => {
                settings.reduceMotion = e.target.checked;
                saveSettings();
                applySettings();
            });
            document.getElementById('settingClearCache').addEventListener('click', () => {
                thumbCache.clear();
                loadCards(state.currentPage);
            });
        }

        // 设置面板开关
        document.getElementById('settingsBtn').addEventListener('click', () => {
            document.getElementById('settingsModal').classList.add('active');
        });
        document.getElementById('settingsClose').addEventListener('click', () => {
            document.getElementById('settingsModal').classList.remove('active');
        });

        // 启动即应用主题/动画/视图偏好（背景等配置返回后再补应用）
        initSettingsUI();
        applySettings();

        // 从 URL 恢复筛选状态（刷新/分享链接保留）
        (function restoreFiltersFromUrl() {
            const params = new URLSearchParams(location.search);
            if (params.get('q')) {
                state.searchQuery = params.get('q');
                document.getElementById('searchInput').value = state.searchQuery;
                document.getElementById('searchClear').classList.add('visible');
            }
            if (params.get('scope')) {
                state.searchScope = params.get('scope');
                document.getElementById('searchScope').value = state.searchScope;
            }
            if (params.get('tag')) state.selectedTag = params.get('tag');
            if (params.get('favorite') === 'true') {
                state.favoritesOnly = true;
                document.getElementById('favoriteFilter').checked = true;
            }
            if (params.get('hasChat') === 'true') {
                state.hasChatOnly = true;
                document.getElementById('chatFilter').checked = true;
            }
        })();

        // 站点自定义配置（环境变量 SITE_NAME / SITE_TITLE / SITE_BACKGROUND，公开接口）
        (async function loadSiteConfig() {
            try {
                const res = await fetch(`${API_BASE}/config`);
                const data = await res.json();
                if (data.ok) {
                    siteConfig = data.data;
                    if (siteConfig.siteTitle) document.title = siteConfig.siteTitle;
                    if (siteConfig.siteName) {
                        document.querySelector('.navbar-brand').textContent = siteConfig.siteName;
                        document.querySelector('.login-title').textContent = siteConfig.siteName;
                    }
                }
            } catch (e) { /* 使用默认品牌 */ }
            // 背景可用性此时才确定：未配置则禁用开关并提示
            if (!siteConfig.siteBackground) {
                document.getElementById('settingBackground').disabled = true;
                document.getElementById('settingBackgroundHint').style.display = 'block';
            }
            applySettings();
        })();

        // 工具函数
        async function api(endpoint, options = {}) {
            const url = `${API_BASE}${endpoint}`;
            const headers = {
                'Authorization': `Bearer ${state.token}`,
                ...options.headers
            };

            if (options.body && !(options.body instanceof FormData)) {
                headers['Content-Type'] = 'application/json';
                options.body = JSON.stringify(options.body);
            }

            const response = await fetch(url, { ...options, headers });
            const data = await response.json();
            
            if (!data.ok) {
                throw new Error(data.error || '请求失败');
            }
            
            return data;
        }

        // HTML 转义
        function esc(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        // 文件大小格式化
        function formatSize(bytes) {
            if (!bytes) return '';
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1024 / 1024).toFixed(1) + ' MB';
        }

        // 带认证的文件下载（img/window.open 无法携带 Authorization）
        async function authDownload(url, fallbackName) {
            const res = await fetch(url, { headers: { 'Authorization': `Bearer ${state.token}` } });
            if (!res.ok) throw new Error('下载失败');
            const blob = await res.blob();
            const m = (res.headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/);
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = m ? decodeURIComponent(m[1]) : fallbackName;
            a.click();
            URL.revokeObjectURL(a.href);
        }

        // 缩略图会话缓存（cardId -> blobURL），避免重复从 Telegram 下载
        const thumbCache = new Map();

        // 加载需要认证的缩略图（并行）
        async function loadThumbs(cards) {
            const pending = cards.filter(c => c.thumbUrl && !thumbCache.has(c.id));
            await Promise.all(pending.map(async card => {
                try {
                    const res = await fetch(card.thumbUrl, { headers: { 'Authorization': `Bearer ${state.token}` } });
                    if (res.ok) {
                        thumbCache.set(card.id, URL.createObjectURL(await res.blob()));
                    }
                } catch (e) { /* 保持占位图 */ }
            }));
            for (const card of cards) {
                const url = thumbCache.get(card.id);
                if (!url) continue;
                // 设置所有匹配的图片（网格/列表/详情页可能同时存在同一张卡）
                document.querySelectorAll(`img[data-card-id="${card.id}"]`).forEach(img => {
                    img.src = url;
                });
            }
        }

        // 登录
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            
            try {
                const data = await api('/auth/login', {
                    method: 'POST',
                    body: { password }
                });
                
                state.token = data.data.token;
                localStorage.setItem('token', state.token);
                showApp();
            } catch (error) {
                alert(error.message);
            }
        });

        // 显示应用
        function showApp() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('app').classList.add('active');
            loadCards();
            loadTags();
        }

        // 加载角色卡
        async function loadCards(page = 1) {
            try {
                const params = new URLSearchParams({
                    page: page.toString(),
                    limit: String(settings.pageSize || 30),
                    sort: state.sortBy
                });

                if (state.searchQuery) {
                    params.append('q', state.searchQuery);
                    params.append('scope', state.searchScope);
                }
                if (state.selectedTag) params.append('tag', state.selectedTag);
                if (state.favoritesOnly) params.append('favorite', 'true');
                if (state.hasChatOnly) params.append('hasChat', 'true');

                // 同步筛选状态到 URL（刷新/分享保留）
                const qs = params.toString();
                history.replaceState(null, '', qs ? `?${qs}` : location.pathname);

                const data = await api(`/cards?${params}`);
                
                state.cards = data.data;
                state.currentPage = data.page;
                state.totalPages = Math.ceil(data.total / data.limit);
                
                renderCards();
                renderPagination();
                document.getElementById('cardCount').textContent = `共 ${data.total} 张角色卡`;
            } catch (error) {
                console.error('加载失败:', error);
            }
        }

        // 渲染角色卡
        function renderCards() {
            const container = document.getElementById('cardsContainer');

            if (state.cards.length === 0) {
                container.className = '';
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🗂️</div>
                        <p>没有找到匹配的角色卡</p>
                        <p class="empty-hint">试试调整搜索关键词或清除筛选条件</p>
                    </div>
                `;
                return;
            }

            if (state.viewMode === 'grid') {
                container.className = 'cards-grid';
                container.innerHTML = state.cards.map((card, index) => `
                    <div class="card animate-in stagger-${(index % 4) + 1}" data-id="${card.id}">
                        ${state.selectMode ? `<label style="position:absolute;top:8px;left:8px;z-index:2;background:rgba(0,0,0,0.6);border-radius:6px;padding:6px;" onclick="event.stopPropagation()"><input type="checkbox" class="card-check" data-id="${card.id}" ${state.selectedIds.has(card.id) ? 'checked' : ''}></label>` : ''}
                        <img class="card-image" data-card-id="${card.id}" src="${PLACEHOLDER}" alt="${esc(card.name)}" loading="lazy">
                        <div class="card-content">
                            <h3 class="card-title">${esc(card.name)}</h3>
                            <p class="card-creator">${esc(card.creator || '未知作者')}</p>
                            <div class="card-tags">
                                ${(card.tags || []).slice(0, 3).map(tag => `
                                    <span class="card-tag">${esc(tag)}</span>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `).join('');
            } else {
                container.className = 'cards-list';
                container.innerHTML = state.cards.map((card, index) => `
                    <div class="card-list-item animate-in stagger-${(index % 4) + 1}" data-id="${card.id}">
                        ${state.selectMode ? `<label style="display:flex;align-items:center;" onclick="event.stopPropagation()"><input type="checkbox" class="card-check" data-id="${card.id}" ${state.selectedIds.has(card.id) ? 'checked' : ''}></label>` : ''}
                        <img class="card-list-image" data-card-id="${card.id}" src="${PLACEHOLDER}" alt="${esc(card.name)}" loading="lazy">
                        <div class="card-list-content">
                            <h3 class="card-title">${esc(card.name)}</h3>
                            <p class="card-creator">${esc(card.creator || '未知作者')}</p>
                            <div class="card-tags">
                                ${(card.tags || []).slice(0, 5).map(tag => `
                                    <span class="card-tag">${esc(tag)}</span>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `).join('');
            }

            if (state.selectMode) {
                // 多选模式：点击卡片切换选中
                container.querySelectorAll('[data-id]').forEach(el => {
                    el.addEventListener('click', (e) => {
                        if (e.target.closest('.card-check')) return;
                        toggleSelect(el.dataset.id);
                    });
                });
                container.querySelectorAll('.card-check').forEach(cb => {
                    cb.addEventListener('change', () => toggleSelect(cb.dataset.id));
                });
            } else {
                // 绑定点击事件
                container.querySelectorAll('[data-id]').forEach(el => {
                    el.addEventListener('click', () => showDetail(el.dataset.id));
                });
            }

            loadThumbs(state.cards);
        }

        // 多选切换
        function toggleSelect(id) {
            if (state.selectedIds.has(id)) {
                state.selectedIds.delete(id);
            } else {
                state.selectedIds.add(id);
            }
            document.getElementById('batchCount').textContent = `已选 ${state.selectedIds.size} 张`;
            renderCards();
        }

        // 批量模式
        function toggleBatchMode(on) {
            state.selectMode = on;
            if (!on) state.selectedIds.clear();
            document.getElementById('batchBar').classList.toggle('active', on);
            document.getElementById('batchCount').textContent = `已选 ${state.selectedIds.size} 张`;
            renderCards();
        }

        // 渲染分页
        function renderPagination() {
            const container = document.getElementById('pagination');
            
            if (state.totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = '';
            
            if (state.currentPage > 1) {
                html += `<button class="page-btn" data-page="${state.currentPage - 1}">上一页</button>`;
            }
            
            for (let i = 1; i <= state.totalPages; i++) {
                if (i === 1 || i === state.totalPages || (i >= state.currentPage - 2 && i <= state.currentPage + 2)) {
                    html += `<button class="page-btn ${i === state.currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
                } else if (i === state.currentPage - 3 || i === state.currentPage + 3) {
                    html += `<button class="page-btn" disabled>...</button>`;
                }
            }
            
            if (state.currentPage < state.totalPages) {
                html += `<button class="page-btn" data-page="${state.currentPage + 1}">下一页</button>`;
            }
            
            container.innerHTML = html;
            
            container.querySelectorAll('.page-btn:not([disabled])').forEach(btn => {

        // 渲染标签
        function renderTags() {
            const container = document.getElementById('tagsCloud');
            container.innerHTML = state.tags.map(tag => `
                <span class="tag ${!state.tagManage && state.selectedTag === tag ? 'active' : ''}" data-tag="${esc(tag)}">${esc(tag)}</span>
            `).join('') + (state.tagManage ? `
                <span class="tag" id="tagAddBtn" style="border-style: dashed;">+ 新标签</span>
                <span class="tag" id="tagManageExit">完成</span>
            ` : '') + (state.tags.length && !state.tagManage ? `<span class="tag" id="tagManageBtn" style="border-style: dashed;">管理标签</span>` : '');

            container.querySelectorAll('.tag[data-tag]').forEach(el => {
                el.addEventListener('click', () => {
                    const tag = el.dataset.tag;
                    if (state.tagManage) {
                        manageTag(tag);
                    } else {
                        state.selectedTag = state.selectedTag === tag ? null : tag;
                        renderTags();
                        loadCards();
                    }
                });
            });

            if (addBtn) addBtn.addEventListener('click', addTag);
            const exitBtn = document.getElementById('tagManageExit');
            if (exitBtn) exitBtn.addEventListener('click', () => { state.tagManage = false; renderTags(); });

            const newTag = prompt(`重命名标签「${tag}」（留空则删除该标签）：`, tag);
            if (newTag === null) return;

            try {
                if (newTag.trim() === '') {
                    if (!confirm(`确定要删除标签「${tag}」吗？将从所有角色卡上移除。`)) return;
                    await api('/tags', { method: 'PUT', body: { action: 'delete', tag } });
                } else if (newTag !== tag) {
                    await api('/tags', { method: 'PUT', body: { action: 'rename', tag, newTag: newTag.trim() } });
                    if (state.selectedTag === tag) state.selectedTag = newTag.trim();
                }
                loadTags();
            } catch (error) {
                alert('操作失败: ' + error.message);
            }
        }

        let selectedFiles = [];

        function handleFiles(files) {
            selectedFiles = Array.from(files).filter(f => 
                f.type === 'image/png' || f.name.endsWith('.json')
            );
            
            if (selectedFiles.length > 0) {
                document.getElementById('confirmUpload').disabled = false;
                document.getElementById('uploadZone').innerHTML = `
                    <div class="upload-icon">✅</div>
                    <p class="upload-text">已选择 ${selectedFiles.length} 个文件</p>
                    <p class="upload-hint">${selectedFiles.map(f => f.name).join(', ')}</p>
                `;
            }
        }

        // XHR 上传（fetch 不支持上传进度），onProgress 上报 0~1 的字节进度
        function uploadFile(formData, onProgress) {
            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('POST', `${API_BASE}/cards`);
                xhr.setRequestHeader('Authorization', `Bearer ${state.token}`);
                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) onProgress(e.loaded / e.total);
                };
                xhr.onload = () => {
                    try {
                        const data = JSON.parse(xhr.responseText);
                        if (data.ok) resolve(data);
                        else reject(new Error(data.error || '上传失败'));
                    } catch (e) {
                        reject(new Error('上传失败'));
                    }
                };
                xhr.onerror = () => reject(new Error('网络错误'));
                xhr.send(formData);
            });
        }

        document.getElementById('confirmUpload').addEventListener('click', async () => {
            if (selectedFiles.length === 0) return;

            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const uploadStatus = document.getElementById('uploadStatus');
            progressBar.style.display = 'block';
            uploadStatus.style.display = 'block';
            document.getElementById('confirmUpload').disabled = true;

            let uploaded = 0;
            const failed = [];
            const total = selectedFiles.length;

            for (let i = 0; i < total; i++) {
                const file = selectedFiles[i];
                const formData = new FormData();
                formData.append('file', file);

                // 总进度 = 已完成张数 + 当前张的小数进度
                const setProgress = (fileFrac) => {
                    progressFill.style.width = `${(((i + fileFrac) / total) * 100).toFixed(1)}%`;
                    uploadStatus.textContent = `上传中 ${i + 1}/${total}：${file.name} ${Math.round(fileFrac * 100)}%`;
                };

                // 上传失败自动重试一次（Telegram 限流时等待 15 秒再试）
                let lastError = null;
                for (let attempt = 0; attempt < 2; attempt++) {
                    try {
                        await uploadFile(formData, setProgress);
                        lastError = null;
                        break;
                    } catch (error) {
                        lastError = error;
                        console.error('上传失败（第 ' + (attempt + 1) + ' 次）:', error);
                        if (attempt === 0 && /Too Many Requests|429/i.test(error.message)) {
                            uploadStatus.textContent = `Telegram 限流，15 秒后重试：${file.name}`;
                            await new Promise(r => setTimeout(r, 15000));
                        }
                    }
                }

                if (!lastError) {
                    uploaded++;
                } else {
                    failed.push(`${file.name}（${lastError.message}）`);
                }
                progressFill.style.width = `${(((i + 1) / total) * 100).toFixed(1)}%`;
            }

            uploadStatus.textContent = failed.length
                ? `完成，失败 ${failed.length} 张：${failed.join('、')}`
                : `上传完成: ${uploaded}/${total}`;
            alert(failed.length
                ? `上传完成: ${uploaded}/${total}\n失败：\n${failed.join('\n')}`
                : `上传完成: ${uploaded}/${total}`);
            document.getElementById('uploadModal').classList.remove('active');
            document.getElementById('confirmUpload').disabled = false;
            loadCards();
        });

        // 全量备份
        document.getElementById('exportAllBtn').addEventListener('click', async () => {
            if (!confirm('确定要导出全量备份吗？')) return;

            try {
                const response = await fetch(`${API_BASE}/export/all`, {
                    headers: { 'Authorization': `Bearer ${state.token}` }
                });

                // 去掉 {ok, data} 包装层，与批量导出格式一致
                const data = await response.json();
                if (!data.ok) throw new Error(data.error || '导出失败');
                const blob = new Blob([JSON.stringify(data.data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `character-cards-full-backup-${Date.now()}.json`;
                a.click();
                URL.revokeObjectURL(url);
            } catch (error) {
                alert('导出失败: ' + error.message);
            }
        });

        // 初始化
        if (state.token) {
            showApp();
        }
    </script>
</body>
</html>
